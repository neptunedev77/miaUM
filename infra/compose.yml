# Serviços de apoio para desenvolvimento. A app corre fora do Docker com `npm run dev`.
name: miaum

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: miaum
      POSTGRES_PASSWORD: miaum
      POSTGRES_DB: miaum
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miaum -d miaum"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
